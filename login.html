<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – EduQuest ACT Portal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: #0d0d14;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 36px 32px;
            max-width: 420px;
            width: 100%
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 6px;
            text-align: center
        }

        .sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-bottom: 24px
        }

        /* Role toggle */
        .role-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 18px
        }

        .role-btn {
            flex: 1;
            text-align: center;
            padding: 9px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: all .15s;
            user-select: none
        }

        .role-btn.active {
            background: rgba(26, 86, 219, 0.25);
            color: #fff
        }

        /* Mode tabs (login/signup) */
        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08)
        }

        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 0.88rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all .15s;
            user-select: none
        }

        .mode-tab.active {
            color: #fff;
            border-bottom-color: #1a56db
        }

        .field {
            margin-bottom: 16px
        }

        .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 6px
        }

        .field input {
            width: 100%;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 11px 14px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            background: rgba(255, 255, 255, 0.03);
            color: #fff
        }

        .field input:focus {
            border-color: #1a56db
        }

        .hint {
            font-size: 0.76rem;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 6px;
            line-height: 1.5
        }

        .password-wrapper {
            position: relative;
            display: block;
        }

        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-btn:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 6px;
            transition: all .15s
        }

        .btn-primary {
            background: linear-gradient(135deg, #1a56db, #1e429f);
            color: #fff
        }

        .btn-primary:hover {
            transform: translateY(-1px)
        }

        .btn-primary.admin {
            background: linear-gradient(135deg, #7c3aed, #5b21b6)
        }

        #msg {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 14px;
            min-height: 20px
        }

        #msg.error {
            color: #f87171
        }

        #msg.success {
            color: #34d399
        }

        .form-section {
            display: none
        }

        .form-section.active {
            display: block
        }
    </style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

</head>

<body>
</head>

<body>

    <div class="card">
        <h2>Welcome</h2>
        <p class="sub">Login or create an account to continue</p>

        <!-- ROLE TOGGLE -->
        <div class="role-toggle">
            <div class="role-btn active" id="roleStudent" onclick="setRole('student')">🎓 Student</div>
            <div class="role-btn" id="roleAdmin" onclick="setRole('admin')">🛠 Admin</div>
        </div>

        <!-- MODE TABS -->
        <div class="mode-tabs">
            <div class="mode-tab active" id="tabLogin" onclick="setMode('login')">Login</div>
            <div class="mode-tab" id="tabSignup" onclick="setMode('signup')">Sign Up</div>
        </div>

        <!-- STUDENT LOGIN -->
        <div class="form-section active" id="studentLogin">
            <div class="field">
                <label>Email</label>
                <input type="email" id="stuLoginEmail" placeholder="you@example.com" autocomplete="off" value="">
            </div>
            <div class="field">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="stuLoginPassword" placeholder="••••••••" autocomplete="new-password" value="">
                    <button type="button" class="eye-btn" onclick="togglePassword(this)">👁️</button>
                </div>
            </div>
            <button class="btn btn-primary" onclick="studentLogin()">Login as Student</button>
        </div>

        <!-- STUDENT SIGNUP -->
        <div class="form-section" id="studentSignup">
            <div class="field">
                <label>Email</label>
                <input type="email" id="stuSignupEmail" placeholder="you@example.com" autocomplete="off" value="">
            </div>
            <div class="field">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="stuSignupPassword" placeholder="At least 6 characters" autocomplete="new-password" value="">
                    <button type="button" class="eye-btn" onclick="togglePassword(this)">👁️</button>
                </div>
                <p class="hint">After signup, an admin will need to approve your account before you can access locked exams.</p>
            </div>
            <button class="btn btn-primary" onclick="studentSignup()">Create Student Account</button>
        </div>

        <!-- ADMIN LOGIN -->
        <div class="form-section" id="adminLogin">
            <div class="field">
                <label>Admin Email</label>
                <input type="email" id="adminLoginEmail" placeholder="admin@email.com" autocomplete="off" value="">
            </div>
            <div class="field">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="adminLoginPassword" placeholder="••••••••" autocomplete="new-password" value="">
                    <button type="button" class="eye-btn" onclick="togglePassword(this)">👁️</button>
                </div>
            </div>
            <button class="btn btn-primary admin" onclick="adminLogin()">Login as Admin</button>
        </div>

        <!-- ADMIN SIGNUP -->
        <div class="form-section" id="adminSignup">
            <div class="field">
                <label>Admin Email</label>
                <input type="email" id="adminSignupEmail" placeholder="admin@email.com" autocomplete="off" value="">
            </div>
            <div class="field">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="adminSignupPassword" placeholder="At least 6 characters" autocomplete="new-password" value="">
                    <button type="button" class="eye-btn" onclick="togglePassword(this)">👁️</button>
                </div>
            </div>
            <div class="field">
                <label>Admin Access Code</label>
                <div class="password-wrapper">
                    <input type="password" id="adminAccessCode" placeholder="Secret access code" autocomplete="new-password" value="">
                    <button type="button" class="eye-btn" onclick="togglePassword(this)">👁️</button>
                </div>
                <p class="hint">Only people with the correct access code can create an admin account.</p>
            </div>
            <button class="btn btn-primary admin" onclick="adminSignup()">Create Admin Account</button>
        </div>

        <p id="msg"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="email.js"></script>
    <script>

function formatLaTeX(str) {
    if (!str || typeof str !== 'string') return str || '';
    let res = str.replace(/\$([^\$]+)\$/g, (m, math) => {
        if (window.katex) {
            try {
                return katex.renderToString(math, { throwOnError: false });
            } catch(e) {}
        }
        return `<span class="latex-math">${formatMathCaret(math)}</span>`;
    });
    return formatMathCaret(res);
}

function formatMathCaret(text) {
    if (!text) return '';
    return text.replace(/([A-Za-z0-9\)\}\]]+)\^(\(([^\)]+)\)|(\{([^\}]+)\})|(\-?[A-Za-z0-9\/]+))/g, (m, base, p2, p3, p4, p5, p6) => {
        const exp = p3 || p5 || p6;
        return `${base}<sup>${exp}</sup>`;
    });
}


        const supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        // Change this to your own secret code before deploying
        const ADMIN_ACCESS_CODE = 'Lovelypanda';

        let currentRole = 'student';
        let currentMode = 'login';

        function getRedirect() {
            const params = new URLSearchParams(window.location.search);
            return params.get('redirect') || 'index.html';
        }

        function showMsg(text, type) {
            const m = document.getElementById('msg');
            m.textContent = text;
            m.className = type;
        }

        function togglePassword(btn) {
            const input = btn.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '👁️‍🗨️'; // Crossed eye or similar open eye
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // ── Role / Mode switching ──────────────────────
        function setRole(role) {
            currentRole = role;
            document.getElementById('roleStudent').classList.toggle('active', role === 'student');
            document.getElementById('roleAdmin').classList.toggle('active', role === 'admin');
            updateView();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
            document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
            updateView();
        }

        function updateView() {
            document.getElementById('studentLogin').classList.remove('active');
            document.getElementById('studentSignup').classList.remove('active');
            document.getElementById('adminLogin').classList.remove('active');
            document.getElementById('adminSignup').classList.remove('active');
            showMsg('', '');

            const id = (currentRole === 'student' ? 'student' : 'admin') + (currentMode === 'login' ? 'Login' : 'Signup');
            document.getElementById(id).classList.add('active');
        }

        // ── Student Login ───────────────────────────────
        async function studentLogin() {
            const email = document.getElementById('stuLoginEmail').value.trim();
            const password = document.getElementById('stuLoginPassword').value;
            if (!email || !password) { showMsg('Please fill all fields.', 'error'); return; }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) { showMsg(error.message, 'error'); return; }
            showMsg('Login successful! Redirecting...', 'success');
            setTimeout(() => window.location.href = getRedirect(), 600);
        }

        // ── Student Signup ──────────────────────────────
        async function studentSignup() {
            const email = document.getElementById('stuSignupEmail').value.trim();
            const password = document.getElementById('stuSignupPassword').value;
            if (!email || !password) { showMsg('Please fill all fields.', 'error'); return; }
            if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) { showMsg(error.message, 'error'); return; }

            showMsg('Account created! You can now login. Note: access must be approved by admin.', 'success');
            
            if (typeof sendSignupNotification === 'function') {
                sendSignupNotification(email);
            }
        }

        // ── Admin Login ──────────────────────────────────
        async function adminLogin() {
            const email = document.getElementById('adminLoginEmail').value.trim();
            const password = document.getElementById('adminLoginPassword').value;
            if (!email || !password) { showMsg('Please fill all fields.', 'error'); return; }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) { showMsg(error.message, 'error'); return; }

            showMsg('Admin login successful! Redirecting...', 'success');
            setTimeout(() => window.location.href = 'admin.html', 600);
        }

        // ── Admin Signup ─────────────────────────────────
        async function adminSignup() {
            const email = document.getElementById('adminSignupEmail').value.trim();
            const password = document.getElementById('adminSignupPassword').value;
            const code = document.getElementById('adminAccessCode').value.trim();

            if (!email || !password || !code) { showMsg('Please fill all fields.', 'error'); return; }
            if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }
            if (code !== ADMIN_ACCESS_CODE) { showMsg('Invalid admin access code.', 'error'); return; }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) { showMsg(error.message, 'error'); return; }

            showMsg('Admin account created! You can now login as admin. Make sure this email matches ADMIN_EMAIL in admin.html.', 'success');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const clearFields = () => {
                ['stuLoginEmail', 'stuLoginPassword', 'stuSignupEmail', 'stuSignupPassword', 'adminLoginEmail', 'adminLoginPassword', 'adminSignupEmail', 'adminSignupPassword', 'adminAccessCode'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
            };
            clearFields();
            setTimeout(clearFields, 100);
            setTimeout(clearFields, 400);
        });
    </script>
</body>
</html>
