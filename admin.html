<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – EduQuest</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: #0d0d14;
      color: #fff;
      min-height: 100vh
    }

    .hdr {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06)
    }

    .brand {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700
    }

    .logout {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 6px
    }

    .logout:hover {
      border-color: #1a56db;
      color: #fff
    }

    /* Login */
    .login-wrap {
      max-width: 380px;
      margin: 100px auto;
      padding: 20px
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 28px
    }

    h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center
    }

    .field {
      margin-bottom: 14px
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px
    }

    .field input {
      width: 100%;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      background: rgba(255, 255, 255, 0.03);
      color: #fff
    }

    .field input:focus {
      border-color: #1a56db
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, #1a56db, #1e429f);
      color: #fff;
      margin-top: 6px
    }

    .btn:hover {
      transform: translateY(-1px)
    }

    #loginMsg {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 10px;
      color: #f87171;
      min-height: 18px
    }

    /* Dashboard */
    .wrap {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px
    }

    .stats {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap
    }

    .stat {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 22px;
      flex: 1;
      min-width: 120px
    }

    .stat .num {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #60a5fa
    }

    .stat .lbl {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-top: 2px
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px
    }

    .tab {
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.6)
    }

    .tab.active {
      background: rgba(26, 86, 219, 0.2);
      border-color: #1a56db;
      color: #fff
    }

    .search {
      width: 100%;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      margin-bottom: 16px
    }

    .search:focus {
      border-color: #1a56db
    }

    .user-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap
    }

    .user-info {
      flex: 1;
      min-width: 200px
    }

    .user-info .email {
      font-weight: 600;
      font-size: 0.95rem
    }

    .user-info .meta {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 3px
    }

    .badge {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 100px;
      font-weight: 600;
      display: inline-block;
      margin-top: 6px
    }

    .badge.granted {
      background: rgba(5, 150, 105, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(5, 150, 105, 0.3)
    }

    .badge.pending {
      background: rgba(217, 119, 6, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(217, 119, 6, 0.3)
    }

    .actions {
      display: flex;
      gap: 8px
    }

    .btn-sm {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      border: none
    }

    .btn-approve {
      background: #059669;
      color: #fff
    }

    .btn-approve:hover {
      background: #047857
    }

    .btn-revoke {
      background: rgba(220, 38, 38, 0.15);
      color: #f87171;
      border: 1px solid rgba(220, 38, 38, 0.3)
    }

    .btn-revoke:hover {
      background: rgba(220, 38, 38, 0.25)
    }

    .org-input {
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      font-family: inherit;
      width: 120px
    }

    .empty {
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      padding: 40px;
      font-size: 0.9rem
    }

    .loading {
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      padding: 40px
    }
  </style>
</head>

<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <header class="hdr">
      <div class="brand">📝 EduQuest Admin</div>
      <div></div>
    </header>
    <div class="login-wrap">
      <div class="card">
        <h2>Admin Login</h2>
        <div class="field">
          <label>Email</label>
          <input type="email" id="adminEmail" placeholder="admin@email.com">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="adminPassword" placeholder="••••••••">
        </div>
        <button class="btn" onclick="adminLogin()">Login</button>
        <p id="loginMsg"></p>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none">
    <header class="hdr">
      <div class="brand">📝 EduQuest Admin</div>
      <button class="logout" onclick="adminLogout()">Logout</button>
    </header>
    <div class="wrap">
      <div class="stats">
        <div class="stat">
          <div class="num" id="statTotal">–</div>
          <div class="lbl">Total Users</div>
        </div>
        <div class="stat">
          <div class="num" id="statApproved">–</div>
          <div class="lbl">Approved</div>
        </div>
        <div class="stat">
          <div class="num" id="statPending">–</div>
          <div class="lbl">Pending</div>
        </div>
      </div>

      <div class="tabs">
        <div class="tab active" data-filter="pending" onclick="setFilter('pending')">Pending</div>
        <div class="tab" data-filter="approved" onclick="setFilter('approved')">Approved</div>
        <div class="tab" data-filter="all" onclick="setFilter('all')">All</div>
      </div>

      <input type="text" class="search" id="searchBox" placeholder="Search by email..." oninput="renderList()">

      <div id="userList">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Modal for User History -->
  <div id="userHistoryModal"
    style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 999; overflow-y: auto; padding: 40px 20px;">
    <div
      style="max-width: 800px; margin: 0 auto; background: #0d0d14; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; position: relative;">
      <button onclick="closeUserHistoryModal()"
        style="position: absolute; top: 20px; right: 20px; background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 50%; width: 36px; height: 36px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>
      <h2
        style="font-family: 'Syne', sans-serif; font-size: 1.8rem; text-align: center; margin-bottom: 20px; color: #fff;"
        id="historyModalTitle">Student History</h2>
      <div id="historyModalContent"></div>
    </div>
  </div>

  <!-- Modal for report details -->
  <div id="reportModal"
    style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto; padding: 40px 20px;">
    <div
      style="max-width: 900px; margin: 0 auto; background: #0d0d14; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; position: relative;">
      <button onclick="closeReportModal()"
        style="position: absolute; top: 20px; right: 20px; background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 50%; width: 36px; height: 36px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>
      <h2
        style="font-family: 'Syne', sans-serif; font-size: 1.8rem; text-align: center; margin-bottom: 20px; color: #fff;"
        id="modalExamTitle">Test Review</h2>
      <div id="modalReportContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="questions.js"></script>
  <script src="questions2.js"></script>
  <script src="test_3/questions3.js"></script>
  <script src="supabase.js"></script>
  <script src="report.js"></script>
  <script src="act_questions1.js"></script>
  <script src="act_report1.js"></script>
  <script>
    const ADMIN_EMAIL = 'rupali.eduquest@gmail.com'; // <-- yahan apna admin email daalo

    const supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

    let allProfiles = [];
    let currentFilter = 'pending';

    // ── Check session on load ──────────────────────
    (async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user.email === ADMIN_EMAIL) {
        showDashboard();
      } else {
        showLogin();
      }
    })();

    function showLogin() {
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadProfiles();
    }

    // ── Login ───────────────────────────────────────
    async function adminLogin() {
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const msg = document.getElementById('loginMsg');

      if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        msg.textContent = 'This account is not authorized as admin.';
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        msg.textContent = error.message;
        return;
      }
      showDashboard();
    }

    async function adminLogout() {
      await supabaseClient.auth.signOut();
      showLogin();
    }

    // ── Load profiles and test results ────────────────
    async function loadProfiles() {
      const listContainer = document.getElementById('userList');
      listContainer.innerHTML = `<div class="loading">Loading database entries...</div>`;
      try {
        // Profiles
        const { data: profiles, error: errP } = await supabaseClient
          .from('profiles').select('*').order('created_at', { ascending: false });
        if (errP) throw errP;

        // SAT results
        const { data: satResults, error: errS } = await supabaseClient
          .from('sat_results').select('*').order('submitted_at', { ascending: false });
        if (errS) throw errS;

        // ACT results
        const { data: actResults, error: errA } = await supabaseClient
          .from('act_results').select('*').order('submitted_at', { ascending: false });
        if (errA) console.warn('Could not fetch ACT results:', errA);

        // Topic results (existing)
        const { data: topicResults, error: errT } = await supabaseClient
          .from('sat_topic_report').select('*');
        if (errT) console.warn('Could not fetch topic reports:', errT);

        const allRawResults = [];

        // Tag SAT results
        (satResults || []).forEach(r => {
          allRawResults.push({
            ...r, _type: 'sat',
            _email: (r.student_email || '').toLowerCase().trim(),
            _name: r.student_name,
            _date: r.submitted_at || null
          });
        });

        // Tag ACT results
        (actResults || []).forEach(r => {
          allRawResults.push({
            ...r, _type: 'act',
            _email: (r.student_email || '').toLowerCase().trim(),
            _name: r.student_name,
            _date: r.submitted_at || null
          });
        });

        // Tag topic results
        (topicResults || []).forEach(r => {
          allRawResults.push({
            ...r, _type: 'topic',
            _email: (r.email || '').toLowerCase().trim(),
            _name: r.name,
            _date: r.submit_time || null
          });
        });

        // Sort all by date
        allRawResults.sort((a, b) => new Date(b._date) - new Date(a._date));

        // Group by email
        const resultsByEmail = {};
        allRawResults.forEach(r => {
          if (!r._email) return;
          if (!resultsByEmail[r._email]) resultsByEmail[r._email] = [];
          resultsByEmail[r._email].push(r);
        });

        // Build student map
        const studentMap = {};
        (profiles || []).forEach(p => {
          if (!p.email) return;
          const emailKey = p.email.toLowerCase().trim();
          const userResults = resultsByEmail[emailKey] || [];
          let displayName = emailKey.split('@')[0];
          if (userResults.length > 0 && userResults[0]._name) displayName = userResults[0]._name;

          studentMap[emailKey] = {
            id: p.id, email: p.email, name: displayName,
            created_at: p.created_at, has_access: p.has_access || false,
            organization: p.organization || '',
            tests_count: userResults.length,
            results: userResults,
            has_profile: true
          };
        });

        // Add users with results but no profile
        Object.entries(resultsByEmail).forEach(([emailKey, userResults]) => {
          if (studentMap[emailKey]) return;
          studentMap[emailKey] = {
            id: null, email: userResults[0]._email || emailKey,
            name: userResults[0]._name || emailKey.split('@')[0],
            created_at: userResults[userResults.length - 1]._date,
            has_access: false, organization: '',
            tests_count: userResults.length,
            results: userResults, has_profile: false
          };
        });

        allProfiles = Object.values(studentMap).sort(
          (a, b) => new Date(b.created_at) - new Date(a.created_at)
        );

        updateStats();
        renderList();
      } catch (err) {
        console.error('Error loading admin dashboard:', err);
        listContainer.innerHTML = `<div class="empty">Error loading data: ${err.message}</div>`;
      }
    }

    function updateStats() {
      const profilesOnly = allProfiles.filter(p => p.has_profile);
      const total = profilesOnly.length;
      const approved = profilesOnly.filter(p => p.has_access).length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statApproved').textContent = approved;
      document.getElementById('statPending').textContent = total - approved;
    }

    // ── Filter tabs ───────────────────────────────────
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[data-filter="${filter}"]`).classList.add('active');
      renderList();
    }

    // ── Render list ───────────────────────────────────
    function renderList() {
      const search = document.getElementById('searchBox').value.trim().toLowerCase();
      let list = allProfiles;

      if (currentFilter === 'pending') {
        list = list.filter(p => p.has_profile && !p.has_access);
      } else if (currentFilter === 'approved') {
        list = list.filter(p => p.has_profile && p.has_access);
      }

      if (search) {
        list = list.filter(p => (p.email || '').toLowerCase().includes(search) || (p.name || '').toLowerCase().includes(search));
      }

      const container = document.getElementById('userList');
      if (list.length === 0) {
        container.innerHTML = `<div class="empty">No users found.</div>`;
        return;
      }

      container.innerHTML = list.map(p => {
        let badgeHtml = '';
        let orgHtml = '';
        let actionButtons = '';

        if (p.has_profile) {
          badgeHtml = `<span class="badge ${p.has_access ? 'granted' : 'pending'}">${p.has_access ? '✓ Access Granted' : '⏳ Pending'}</span>`;
          orgHtml = `<input type="text" class="org-input" placeholder="Organization" value="${p.organization || ''}"
            onchange="updateOrg('${p.id}', this.value)" style="margin-left:10px">`;
          actionButtons = p.has_access
            ? `<button class="btn-sm btn-revoke" onclick="setAccess('${p.id}', false)">Revoke</button>`
            : `<button class="btn-sm btn-approve" onclick="setAccess('${p.id}', true)">Approve</button>`;
        } else {
          badgeHtml = `<span class="badge pending" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.4);border-color:rgba(255,255,255,0.1)">No Account</span>`;
          orgHtml = `<span style="font-size:0.78rem;color:rgba(255,255,255,0.3);margin-left:10px">External</span>`;
          actionButtons = `<span style="font-size:0.78rem;color:rgba(255,255,255,0.3);padding:8px 0;display:inline-block">N/A</span>`;
        }

        return `
          <div class="user-card">
            <div class="user-info">
              <div class="email">${p.email || '(no email)'}</div>
              <div class="meta">
                <span>Name: ${p.name}</span> &middot; 
                <span>Completed Tests: ${p.tests_count}</span> &middot; 
                <span>Registered: ${p.created_at ? new Date(p.created_at).toLocaleDateString('en-IN') : '–'}</span>
              </div>
              <div style="margin-top: 6px; display: flex; align-items: center;">
                ${badgeHtml}
                ${orgHtml}
              </div>
            </div>
            <div class="actions">
              <button class="btn-sm" style="background:#1a56db;color:#fff;margin-right:4px;cursor:pointer" onclick="showUserHistory('${p.email}')">History</button>
              ${actionButtons}
            </div>
          </div>
        `;
      }).join('');
    }

    // ── Approve / Revoke ────────────────────────────
    async function setAccess(userId, value) {
      const { error } = await supabaseClient
        .from('profiles')
        .update({ has_access: value })
        .eq('id', userId);

      if (error) {
        alert('Update failed: ' + error.message);
        return;
      }

      const p = allProfiles.find(x => x.id === userId);
      if (p) p.has_access = value;
      updateStats();
      renderList();
    }

    // ── Update organization ──────────────────────────
    async function updateOrg(userId, value) {
      const { error } = await supabaseClient
        .from('profiles')
        .update({ organization: value })
        .eq('id', userId);

      if (error) {
        alert('Update failed: ' + error.message);
        return;
      }

      const p = allProfiles.find(x => x.id === userId);
      if (p) p.organization = value;
    }

    // ── Admin Dashboard Student History popup helpers ──
    let activeUserHistory = [];

    async function showUserHistory(email) {
      document.getElementById('historyModalTitle').textContent = `History: ${email}`;
      document.getElementById('historyModalContent').innerHTML = `<div style="text-align: center; padding: 20px; color: rgba(255,255,255,0.6);">Loading test history...</div>`;
      document.getElementById('userHistoryModal').style.display = 'block';
      document.body.style.overflow = 'hidden';

      const student = allProfiles.find(s => s.email.toLowerCase() === email.toLowerCase());
      if (student) {
        activeUserHistory = student.results || [];
        renderHistoryModalList(email);
      } else {
        document.getElementById('historyModalContent').innerHTML = `<div style="text-align: center; padding: 20px; color: #f87171;">Student data not found.</div>`;
      }
    }

    function closeUserHistoryModal() {
      document.getElementById('userHistoryModal').style.display = 'none';
      document.body.style.overflow = '';
    }

    function renderHistoryModalList(email) {
      const container = document.getElementById('historyModalContent');
      if (activeUserHistory.length === 0) {
        container.innerHTML = `<div style="text-align: center; padding: 20px; color: rgba(255,255,255,0.5);">This student has not completed any tests yet.</div>`;
        return;
      }

      let headerHTML = '';
      const practiceExams = activeUserHistory.filter(r => r._type === 'practice');
      if (practiceExams.length >= 2) {
        headerHTML = `<div style="text-align: right; margin-bottom: 15px;">
          <button class="btn" style="display: inline-block; width: auto; background: #059669; font-size: 0.85rem; padding: 6px 14px;" onclick="downloadAdminCombinedReport('${email}')">Download Combined Report (PDF)</button>
        </div>`;
      }

      const listHTML = activeUserHistory.map((row, idx) => {
        const isTopic = row._type === 'topic';
        const dateStr = new Date(row._date).toLocaleDateString('en-IN', {
          day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        let scoreDisplay;
        if (isTopic) {
          scoreDisplay = `<span style="font-size:1.2rem;font-weight:700;color:#34d399">${row.pct || row.percentage || 0}%</span>
                     <span style="font-size:0.78rem;color:rgba(255,255,255,0.4)"> Accuracy</span>`;
        } else if (row._type === 'act') {
          scoreDisplay = `<span style="font-size:1.2rem;font-weight:700;color:#34d399">${row.composite_score || '—'}</span>
                     <span style="font-size:0.78rem;color:rgba(255,255,255,0.4)">/ 36 (ACT)</span>`;
        } else {
          scoreDisplay = row.sat_score
            ? `<span style="font-size:1.2rem;font-weight:700;color:#34d399">${row.sat_score}</span>
               <span style="font-size:0.78rem;color:rgba(255,255,255,0.4)">/ 1600 (SAT)</span>`
            : `<span style="font-size:1.2rem;font-weight:700;color:#34d399">${row.rw_score || '—'}</span>
               <span style="font-size:0.78rem;color:rgba(255,255,255,0.4)"> (R&W)</span>`;
        }

    const badgeHtml = isTopic
      ? `<span style="display:inline-block; margin-left: 8px; padding: 2px 6px; font-size: 0.65rem; border-radius: 4px; background: rgba(96, 165, 250, 0.2); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3);">Topic Test</span>`
      : `<span style="display:inline-block; margin-left: 8px; padding: 2px 6px; font-size: 0.65rem; border-radius: 4px; background: rgba(52, 211, 153, 0.2); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3);">Practice Exam</span>`;

    const titleStr = isTopic ? (row.topic || 'Topic Test') : (row.exam_name || 'Digital SAT Practice');

    let actionBtns = `<button class="btn" style="width: auto; margin: 0; padding: 5px 10px; font-size: 0.78rem;" onclick="viewAdminReportDetails(${idx})">View Review</button>
                          <button class="btn" style="width: auto; margin: 0; padding: 5px 10px; font-size: 0.78rem; background: none; border: 1px solid rgba(255,255,255,0.2);" onclick="downloadAdminSinglePDF(${idx})">PDF</button>`;

    return `
          <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap;">
            <div>
              <div style="font-weight: 700; font-size: 0.95rem; color: #fff;">${titleStr} ${badgeHtml}</div>
              <div style="font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 2px;">Date: ${dateStr}</div>
              <div style="margin-top: 4px; font-size: 0.75rem; color: rgba(255,255,255,0.6);">
                <span>Grade: ${row.grade || '—'}</span> &middot; <span>Accuracy: ${row.percentage || row.pct || 0}%</span>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
              <div style="text-align: right;">
                <div style="font-size: 0.68rem; color: rgba(255,255,255,0.4); text-transform: uppercase;">Score</div>
                <div>${scoreDisplay}</div>
              </div>
              <div style="display: flex; gap: 6px; align-items: center;">
                ${actionBtns}
              </div>
            </div>
          </div>
        `;
      }).join('');

    container.innerHTML = headerHTML + listHTML;
    }

    // ── Reconstruct Result Object from row ──────────

    function reconstructResult(row) {
      if (row._type === 'act') {
        const details = (row.student_answers || []).map(ans => {
          const origQ = (typeof ACT_QUESTIONS1 !== 'undefined'
            ? ACT_QUESTIONS1.find(q => q.id === ans.question_id)
            : null) || {};
          return {
            ...origQ,
            id: ans.question_id,
            section: ans.section,
            topic: ans.topic,
            status: ans.status,
            chosen: ans.chosen_option !== null && ans.chosen_option !== undefined
              ? ['A', 'B', 'C', 'D'].indexOf(ans.chosen_option) : undefined,
            answer: ['A', 'B', 'C', 'D'].indexOf(ans.correct_option)
          };
        });
        return {
          student: { name: row.student_name, email: row.student_email, phone: row.student_phone },
          examName: row.exam_name || 'ACT Practice Test 1',
          correct: row.correct, wrong: row.wrong, unattempted: row.skipped,
          total: row.total, pct: row.percentage, grade: row.grade,
          composite: row.composite_score,
          sectionScores: {
            english: row.english_score, math: row.math_score,
            reading: row.reading_score, science: row.science_score
          },
          scaled: row.composite_score, rwScore: null, mathScore: null,
          details, submitTime: row.submitted_at,
          topicAnalysis: Object.entries(row.topic_scores || {}).map(([key, t]) => ({
            key, section: t.section, name: t.topic,
            total: t.total, correct: t.correct, wrong: t.wrong, acc: t.accuracy
          }))
        };
      }

      if (row._type === 'topic') {
        let details = [];
        try {
          const parsed = JSON.parse(row.details_json || '[]');
          details = parsed.map(q => ({
            id: q.id, topic: row.topic,
            text: 'Question text not available for topic tests.',
            options: ['Option A', 'Option B', 'Option C', 'Option D'],
            status: q.status,
            chosen: q.chosen !== undefined ? q.chosen : (q.status === 'correct' ? q.answer : null),
            answer: q.answer
          }));
        } catch (e) { console.error('Error parsing topic details', e); }
        return {
          student: { name: row.name, email: row.email, phone: row.phone },
          examName: row.topic || 'Topic Test',
          correct: row.correct, wrong: row.wrong, unattempted: row.unattempted,
          total: row.total, pct: row.pct || row.percentage, grade: row.grade,
          scaled: null, rwScore: null, mathScore: null,
          details, submitTime: row.submit_time || row.created_at, topicAnalysis: []
        };
      }

      // SAT (existing logic)
      let examQs = [];
      if (row.exam_name?.includes('Exam 3')) examQs = typeof QUESTIONS3 !== 'undefined' ? QUESTIONS3 : [];
      else if (row.exam_name?.includes('Exam 2')) examQs = typeof QUESTIONS2 !== 'undefined' ? QUESTIONS2 : [];
      else examQs = typeof QUESTIONS !== 'undefined' ? QUESTIONS : [];

      const details = (row.student_answers || []).map(ans => {
        const originalQ = examQs.find(q => q.id === ans.question_id) || {};
        return {
          ...originalQ, id: ans.question_id, section: ans.section, topic: ans.topic, status: ans.status,
          chosen: originalQ.isFillIn ? ans.chosen_option
            : (ans.chosen_option !== null && ans.chosen_option !== undefined
              ? ['A', 'B', 'C', 'D'].indexOf(ans.chosen_option) : undefined),
          answer: originalQ.isFillIn ? undefined : ['A', 'B', 'C', 'D'].indexOf(ans.correct_option)
        };
      });

      return {
        student: { name: row.student_name, email: row.student_email, phone: row.student_phone },
        examName: row.exam_name || 'Digital SAT Practice Exam 1',
        correct: row.correct, wrong: row.wrong, unattempted: row.skipped,
        total: row.total, pct: row.percentage, grade: row.grade,
        scaled: row.sat_score, rwScore: row.rw_score, mathScore: row.math_score,
        details, submitTime: row.submitted_at,
        topicAnalysis: Object.entries(row.topic_scores || {}).map(([name, s]) => ({
          name, total: s.total, correct: s.correct, wrong: s.wrong, acc: s.accuracy
        }))
      };
    }

    // ── Actions ─────────────────────────────────────
    function viewAdminReportDetails(idx) {
      const row = activeUserHistory[idx];
      const result = reconstructResult(row);
      document.getElementById('modalExamTitle').textContent = `${result.student.name} — ${result.examName} Detailed Review`;
      renderModalReport(result);
      document.getElementById('reportModal').style.display = 'block';
    }

    function closeReportModal() {
      document.getElementById('reportModal').style.display = 'none';
    }

    function filterAdminModalQs(status, btn) {
      // Update button styles
      const btns = btn.parentElement.querySelectorAll('button');
      btns.forEach(b => {
        b.style.background = 'rgba(255,255,255,0.1)';
        b.style.border = '1px solid rgba(255,255,255,0.2)';
      });
      btn.style.background = '#1a56db';
      btn.style.border = 'none';

      // Filter cards
      const cards = document.querySelectorAll('.modal-q-card');
      cards.forEach(card => {
        if (status === 'all' || card.getAttribute('data-status') === status) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }


    function downloadAdminSinglePDF(idx) {
      const row = activeUserHistory[idx];
      const result = reconstructResult(row);
      if (row._type === 'act') {
        if (typeof generateACTPDFReport === 'function') {
          generateACTPDFReport(result, true);
        } else { alert('ACT PDF generator not loaded.'); }
      } else {
        if (typeof generatePDFReport === 'function') {
          generatePDFReport(result, true);
        } else { alert('PDF generator not loaded.'); }
      }
    }
    function downloadAdminCombinedReport(email) {
      const practiceExams = activeUserHistory.filter(r => r._type === 'practice');
      if (practiceExams.length < 2) return;
      const resultsList = practiceExams.map(row => reconstructResult(row));
      const studentInfo = {
        name: practiceExams[0]._name,
        email: practiceExams[0]._email,
        phone: practiceExams[0].student_phone || ''
      };
      if (typeof generateCombinedPDF === 'function') {
        generateCombinedPDF(resultsList, studentInfo);
      } else {
        alert('Combined PDF Generation helper not loaded.');
      }
    }

    // ── Render Complete Questions inside modal ──────
    function renderModalReport(result) {
      const LETTERS = ['A', 'B', 'C', 'D'];
      const { correct, wrong, unattempted, total, pct, scaled, rwScore, mathScore, details, composite, sectionScores, examName } = result;
      const scoreColor = pct >= 70 ? '#34d399' : pct >= 50 ? '#fbbf24' : '#f87171';
      const isACT = (examName || '').toUpperCase().includes('ACT');

      let scoreHTML = '';
      if (isACT) {
        scoreHTML = `<div style="font-size: 3.5rem; font-weight: 800; color: ${scoreColor}; font-family: 'Syne', sans-serif; line-height: 1;">${composite || scaled || '—'}</div>
                     <div style="font-size: 0.95rem; color: rgba(255,255,255,0.5); margin-top: 4px;">ACT Composite Score &middot; ${correct} / ${total} Correct (${pct}%)</div>`;
      } else if (scaled) {
        scoreHTML = `<div style="font-size: 3.5rem; font-weight: 800; color: ${scoreColor}; font-family: 'Syne', sans-serif; line-height: 1;">${scaled}</div>
                     <div style="font-size: 0.95rem; color: rgba(255,255,255,0.5); margin-top: 4px;">SAT Score Estimate &middot; ${correct} / ${total} Correct (${pct}%)</div>`;
      } else {
        scoreHTML = `<div style="font-size: 3.5rem; font-weight: 800; color: ${scoreColor}; font-family: 'Syne', sans-serif; line-height: 1;">${rwScore || '—'}</div>
                     <div style="font-size: 0.95rem; color: rgba(255,255,255,0.5); margin-top: 4px;">Reading & Writing Score &middot; ${correct} / ${total} Correct (${pct}%)</div>`;
      }

      let breakDownHTML = '';
      if (isACT && sectionScores) {
         breakDownHTML = `
            <div><strong>English:</strong> ${sectionScores.english || '—'}</div>
            <div><strong>Math:</strong> ${sectionScores.math || '—'}</div>
            <div><strong>Reading:</strong> ${sectionScores.reading || '—'}</div>
            <div><strong>Science:</strong> ${sectionScores.science || '—'}</div>
            <div><strong>Correct:</strong> ${correct}</div>
            <div><strong>Wrong:</strong> ${wrong}</div>
            <div><strong>Skipped:</strong> ${unattempted}</div>
         `;
      } else {
         breakDownHTML = `
            <div><strong>R&W Score:</strong> ${rwScore || '—'}</div>
            <div><strong>Math Score:</strong> ${mathScore || '—'}</div>
            <div><strong>Correct:</strong> ${correct}</div>
            <div><strong>Wrong:</strong> ${wrong}</div>
            <div><strong>Skipped:</strong> ${unattempted}</div>
         `;
      }

      let html = `
        <div style="text-align: center; margin-bottom: 30px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
          ${scoreHTML}
          <div style="display: flex; justify-content: center; gap: 30px; margin-top: 20px; flex-wrap: wrap;">
            ${breakDownHTML}
          </div>
        </div>
        
        <div style="margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
            <h3 style="font-family: 'Syne', sans-serif; font-size: 1.25rem; color: #60a5fa; margin: 0;">📝 Complete Questions &amp; Answers Review</h3>
            <div style="display: flex; gap: 8px;">
              <button class="btn-sm" style="background:#1a56db;color:#fff;border:none;padding:6px 12px;" onclick="filterAdminModalQs('all', this)">All</button>
              <button class="btn-sm" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:6px 12px;" onclick="filterAdminModalQs('correct', this)">Correct</button>
              <button class="btn-sm" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:6px 12px;" onclick="filterAdminModalQs('wrong', this)">Wrong</button>
              <button class="btn-sm" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:6px 12px;" onclick="filterAdminModalQs('unattempted', this)">Skipped</button>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 16px;">
            ${details.map(qObj => {
        const cleanedText = (qObj.text || '').replace(/\n/g, '<br>');
        return `
                <div class="modal-q-card" data-status="${qObj.status}" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 18px; font-size: 0.9rem; text-align: left;">
                  <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                    <span style="font-weight: 600; color: #93c5fd;">Q${qObj.id} [${qObj.topic || ''}]</span>
                    <span style="font-size: 0.78rem; background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 6px; color: rgba(255,255,255,0.6); text-transform: uppercase;">${qObj.section === 'rw' ? 'R&W' : (qObj.section === 'math' ? 'Math' : qObj.section)}</span>
                  </div>
                  <div style="margin-bottom: 12px; line-height: 1.6; color: rgba(255,255,255,0.9);">${cleanedText}</div>
                  
                  ${qObj.image ? `<div style="margin-bottom:12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; text-align: center;">
                    <img src="${qObj.image}" style="max-width: 100%; max-height: 250px; border-radius: 4px;">
                  </div>` : ''}

                  <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
                    ${qObj.status === 'unattempted'
            ? `<div style="color: #fbbf24; font-weight: 500;">➖ Your answer: Skipped</div>
                         <div style="color: #34d399; font-weight: 500;">✅ Correct: ${qObj.isFillIn ? qObj.fillAnswer : `(${LETTERS[qObj.answer]}) ${qObj.options ? qObj.options[qObj.answer] : ''}`}</div>`
            : qObj.status === 'correct'
              ? `<div style="color: #34d399; font-weight: 500;">✅ Your answer: ${qObj.isFillIn ? qObj.chosen : `(${LETTERS[qObj.chosen]}) ${qObj.options ? qObj.options[qObj.chosen] : ''}`} (Correct)</div>`
              : `<div style="color: #f87171; font-weight: 500;">❌ Your answer: ${qObj.isFillIn ? (qObj.chosen || 'None') : `(${LETTERS[qObj.chosen]}) ${qObj.options ? qObj.options[qObj.chosen] : ''}`}</div>
                           <div style="color: #34d399; font-weight: 500;">✅ Correct: ${qObj.isFillIn ? qObj.fillAnswer : `(${LETTERS[qObj.answer]}) ${qObj.options ? qObj.options[qObj.answer] : ''}`}</div>`
          }
                  </div>
                </div>
              `;
      }).join('')}
          </div>
        </div>
      `;
      document.getElementById('modalReportContent').innerHTML = html;
    }
  </script>
</body>

</html>
