<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up – EduQuest ACT Portal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: #0d0d14;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 36px 32px;
            max-width: 440px;
            width: 100%;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.65rem;
            margin-bottom: 6px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-bottom: 22px;
        }

        /* Role toggle */
        .role-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 18px;
        }

        .role-btn {
            flex: 1;
            text-align: center;
            padding: 9px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: all .15s ease;
            user-select: none;
        }

        .role-btn.active {
            background: rgba(26, 86, 219, 0.35);
            color: #fff;
            box-shadow: 0 2px 8px rgba(26, 86, 219, 0.3);
        }

        /* Mode tabs (login/signup) */
        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all .15s ease;
            user-select: none;
        }

        .mode-tab.active {
            color: #fff;
            border-bottom-color: #1a56db;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 6px;
        }

        .field label .req {
            color: #f87171;
            font-weight: 700;
            margin-left: 2px;
        }

        .field input, .field select {
            width: 100%;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 11px 14px;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            transition: border-color 0.15s ease;
        }

        .field input:focus, .field select:focus {
            border-color: #1a56db;
            background: rgba(26, 86, 219, 0.05);
        }

        .phone-row {
            display: flex;
            gap: 8px;
        }

        .phone-row select {
            width: 42%;
            background: #141420;
            cursor: pointer;
            padding: 11px 8px;
            font-size: 0.85rem;
        }

        .phone-row select option {
            background: #141420;
            color: #fff;
        }

        .phone-row input {
            flex: 1;
        }

        .hint {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 6px;
            line-height: 1.5;
        }

        .password-wrapper {
            position: relative;
            display: block;
        }

        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-btn:hover {
            color: rgba(255, 255, 255, 0.85);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 10px;
            transition: all .15s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1a56db, #1e429f);
            color: #fff;
            box-shadow: 0 4px 14px rgba(26, 86, 219, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(26, 86, 219, 0.45);
        }

        .btn-primary.admin {
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
        }

        .btn-primary.admin:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        #msg {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 14px;
            min-height: 20px;
            padding: 8px 12px;
            border-radius: 6px;
            display: none;
        }

        #msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        #msg.success {
            display: block;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>

<body>

    <div class="card">
        <h2>Welcome</h2>
        <p class="sub">Login or create your account to continue</p>

        <!-- ROLE TOGGLE -->
        <div class="role-toggle">
            <div class="role-btn active" id="roleStudent" onclick="setRole('student')">🎓 Student</div>
            <div class="role-btn" id="roleAdmin" onclick="setRole('admin')">🛠 Admin</div>
        </div>

        <!-- MODE TABS -->
        <div class="mode-tabs">
            <div class="mode-tab active" id="tabLogin" onclick="setMode('login')">Login</div>
            <div class="mode-tab" id="tabSignup" onclick="setMode('signup')">Sign Up</div>
        </div>

        <!-- STUDENT LOGIN -->
        <div class="form-section active" id="studentLogin">
            <div class="field">
                <label>Email Address <span class="req">*</span></label>
                <input type="email" id="stuLoginEmail" placeholder="you@example.com" autocomplete="off">
            </div>
            <div class="field">
                <label>Password <span class="req">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="stuLoginPassword" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="eye-btn" onclick="togglePassword(this)">👁️</button>
                </div>
            </div>
            <button class="btn btn-primary" id="btnStudentLogin" onclick="studentLogin()">Login as Student</button>
        </div>

        <!-- STUDENT SIGNUP -->
        <div class="form-section" id="studentSignup">
            <div class="field">
                <label>Full Name <span class="req">*</span></label>
                <input type="text" id="stuSignupName" placeholder="Enter your full name" autocomplete="name">
            </div>
            <div class="field">
                <label>Email Address <span class="req">*</span></label>
                <input type="email" id="stuSignupEmail" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="field">
                <label>Phone Number <span class="req">*</span></label>
                <div class="phone-row">
                    <select id="stuSignupCountryCode"></select>
                    <input type="tel" id="stuSignupPhone" placeholder="Mobile / Phone number" autocomplete="tel">
                </div>
            </div>
            <div class="field">
                <label>Password <span class="req">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="stuSignupPassword" placeholder="At least 6 characters" autocomplete="new-password">
                    <button type="button" class="eye-btn" onclick="togglePassword(this)">👁️</button>
                </div>
                <p class="hint">After signup, an admin will approve your account to grant access to practice and diagnostic tests.</p>
            </div>
            <button class="btn btn-primary" id="btnStudentSignup" onclick="studentSignup()">Create Student Account</button>
        </div>

        <!-- ADMIN LOGIN -->
        <div class="form-section" id="adminLogin">
            <div class="field">
                <label>Admin Email <span class="req">*</span></label>
                <input type="email" id="adminLoginEmail" placeholder="admin@email.com" autocomplete="off">
            </div>
            <div class="field">
                <label>Password <span class="req">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="adminLoginPassword" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="eye-btn" onclick="togglePassword(this)">👁️</button>
                </div>
            </div>
            <button class="btn btn-primary admin" id="btnAdminLogin" onclick="adminLogin()">Login as Admin</button>
        </div>

        <!-- ADMIN SIGNUP -->
        <div class="form-section" id="adminSignup">
            <div class="field">
                <label>Full Name <span class="req">*</span></label>
                <input type="text" id="adminSignupName" placeholder="Admin full name" autocomplete="name">
            </div>
            <div class="field">
                <label>Admin Email <span class="req">*</span></label>
                <input type="email" id="adminSignupEmail" placeholder="admin@email.com" autocomplete="email">
            </div>
            <div class="field">
                <label>Phone Number <span class="req">*</span></label>
                <div class="phone-row">
                    <select id="adminSignupCountryCode"></select>
                    <input type="tel" id="adminSignupPhone" placeholder="Mobile / Phone number" autocomplete="tel">
                </div>
            </div>
            <div class="field">
                <label>Password <span class="req">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="adminSignupPassword" placeholder="At least 6 characters" autocomplete="new-password">
                    <button type="button" class="eye-btn" onclick="togglePassword(this)">👁️</button>
                </div>
            </div>
            <div class="field">
                <label>Admin Access Code <span class="req">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="adminAccessCode" placeholder="Secret access code" autocomplete="new-password">
                    <button type="button" class="eye-btn" onclick="togglePassword(this)">👁️</button>
                </div>
                <p class="hint">Only authorized educators with the admin code can register an admin account.</p>
            </div>
            <button class="btn btn-primary admin" id="btnAdminSignup" onclick="adminSignup()">Create Admin Account</button>
        </div>

        <p id="msg"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="countries.js"></script>
    <script src="supabase.js"></script>
    <script src="email.js"></script>
    <script>
        const supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        // Secret code for creating admin accounts
        const ADMIN_ACCESS_CODE = 'Lovelypanda';

        let currentRole = 'student';
        let currentMode = 'login';

        function getRedirect() {
            const params = new URLSearchParams(window.location.search);
            return params.get('redirect') || 'index.html';
        }

        function showMsg(text, type) {
            const m = document.getElementById('msg');
            if (!text) {
                m.textContent = '';
                m.className = '';
                m.style.display = 'none';
                return;
            }
            m.textContent = text;
            m.className = type;
            m.style.display = 'block';
        }

        function togglePassword(btn) {
            const input = btn.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '👁️‍🗨️';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // ── Populate Country Dropdowns ──────────────────
        function initCountryDropdowns() {
            const selectIds = ['stuSignupCountryCode', 'adminSignupCountryCode'];
            if (typeof COUNTRIES === 'undefined' || !Array.isArray(COUNTRIES)) return;

            selectIds.forEach(id => {
                const select = document.getElementById(id);
                if (!select) return;
                select.innerHTML = '';
                COUNTRIES.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.dial_code;
                    const flag = typeof countryCodeToFlag === 'function' ? countryCodeToFlag(c.code) : '';
                    opt.textContent = `${flag} ${c.dial_code} (${c.code})`;
                    if (c.code === 'IN') {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });
            });
        }

        // ── Role / Mode switching ──────────────────────
        function setRole(role) {
            currentRole = role;
            document.getElementById('roleStudent').classList.toggle('active', role === 'student');
            document.getElementById('roleAdmin').classList.toggle('active', role === 'admin');
            updateView();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
            document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
            updateView();
        }

        function updateView() {
            document.getElementById('studentLogin').classList.remove('active');
            document.getElementById('studentSignup').classList.remove('active');
            document.getElementById('adminLogin').classList.remove('active');
            document.getElementById('adminSignup').classList.remove('active');
            showMsg('', '');

            const id = (currentRole === 'student' ? 'student' : 'admin') + (currentMode === 'login' ? 'Login' : 'Signup');
            document.getElementById(id).classList.add('active');
        }

        // ── Student Login ───────────────────────────────
        async function studentLogin() {
            const email = document.getElementById('stuLoginEmail').value.trim();
            const password = document.getElementById('stuLoginPassword').value;
            const btn = document.getElementById('btnStudentLogin');

            if (!email) { showMsg('Please enter your email address.', 'error'); return; }
            if (!isValidEmail(email)) { showMsg('Please enter a valid email address.', 'error'); return; }
            if (!password) { showMsg('Please enter your password.', 'error'); return; }

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) { showMsg(error.message, 'error'); return; }

                showMsg('Login successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = getRedirect(), 600);
            } catch (err) {
                showMsg('An error occurred during login. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login as Student';
            }
        }

        // ── Student Signup ──────────────────────────────
        async function studentSignup() {
            const name = document.getElementById('stuSignupName').value.trim();
            const email = document.getElementById('stuSignupEmail').value.trim();
            const cc = document.getElementById('stuSignupCountryCode')?.value || '+91';
            const phone = document.getElementById('stuSignupPhone').value.trim();
            const password = document.getElementById('stuSignupPassword').value;
            const btn = document.getElementById('btnStudentSignup');

            // Strict Validation - All fields required
            if (!name) { showMsg('Please enter your full name.', 'error'); return; }
            if (!email) { showMsg('Please enter your email address.', 'error'); return; }
            if (!isValidEmail(email)) { showMsg('Please enter a valid email address format.', 'error'); return; }
            if (!phone) { showMsg('Please enter your phone number.', 'error'); return; }
            if (!password) { showMsg('Please enter a password.', 'error'); return; }
            if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }

            const fullPhone = `${cc} ${phone}`;

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                // 1. Supabase Auth Signup with metadata
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            phone: fullPhone,
                            role: 'student'
                        }
                    }
                });

                if (error) {
                    showMsg(error.message, 'error');
                    return;
                }

                // 2. Save user details in act_signup table
                try {
                    await supabaseClient.from('act_signup').insert([{
                        user_id: data.user?.id || null,
                        email: email,
                        full_name: name,
                        phone: fullPhone,
                        role: 'student',
                        status: 'pending'
                    }]);
                } catch (signupErr) {
                    console.warn('act_signup insert notice:', signupErr);
                }

                // 3. Ensure student profile exists in profiles table
                if (data.user?.id) {
                    try {
                        await supabaseClient.from('profiles').upsert([{
                            id: data.user.id,
                            email: email,
                            full_name: name,
                            phone: fullPhone,
                            has_access: false,
                            has_act_access: false,
                            has_act_diag_access: false,
                            act_access_requested: true
                        }], { onConflict: 'id' });
                    } catch (profileErr) {
                        console.warn('profiles upsert notice:', profileErr);
                    }
                }

                // 4. Send email notification via SMTP to rupali.eduquest@gmail.com with heading 'ACT New Signup'
                if (typeof sendSignupNotification === 'function') {
                    sendSignupNotification({
                        fullName: name,
                        email: email,
                        phone: fullPhone,
                        role: 'student'
                    });
                }

                showMsg('🎉 Account created successfully! You can now log in. Access will be reviewed by admin.', 'success');
                setTimeout(() => {
                    setMode('login');
                    document.getElementById('stuLoginEmail').value = email;
                }, 1500);

            } catch (err) {
                console.error('Signup error:', err);
                showMsg('Signup failed. Please check your internet connection.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Student Account';
            }
        }

        // ── Admin Login ──────────────────────────────────
        async function adminLogin() {
            const email = document.getElementById('adminLoginEmail').value.trim();
            const password = document.getElementById('adminLoginPassword').value;
            const btn = document.getElementById('btnAdminLogin');

            if (!email) { showMsg('Please enter admin email.', 'error'); return; }
            if (!isValidEmail(email)) { showMsg('Please enter a valid email address.', 'error'); return; }
            if (!password) { showMsg('Please enter your password.', 'error'); return; }

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) { showMsg(error.message, 'error'); return; }

                showMsg('Admin login successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'admin.html', 600);
            } catch (err) {
                showMsg('An error occurred during admin login.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login as Admin';
            }
        }

        // ── Admin Signup ─────────────────────────────────
        async function adminSignup() {
            const name = document.getElementById('adminSignupName').value.trim();
            const email = document.getElementById('adminSignupEmail').value.trim();
            const cc = document.getElementById('adminSignupCountryCode')?.value || '+91';
            const phone = document.getElementById('adminSignupPhone').value.trim();
            const password = document.getElementById('adminSignupPassword').value;
            const code = document.getElementById('adminAccessCode').value.trim();
            const btn = document.getElementById('btnAdminSignup');

            // Strict Validation - All fields required
            if (!name) { showMsg('Please enter admin full name.', 'error'); return; }
            if (!email) { showMsg('Please enter admin email address.', 'error'); return; }
            if (!isValidEmail(email)) { showMsg('Please enter a valid email format.', 'error'); return; }
            if (!phone) { showMsg('Please enter phone number.', 'error'); return; }
            if (!password) { showMsg('Please enter password.', 'error'); return; }
            if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }
            if (!code) { showMsg('Please enter the secret Admin Access Code.', 'error'); return; }
            if (code !== ADMIN_ACCESS_CODE) { showMsg('Invalid admin access code.', 'error'); return; }

            const fullPhone = `${cc} ${phone}`;

            btn.disabled = true;
            btn.textContent = 'Creating admin account...';

            try {
                // 1. Supabase Auth Signup
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            phone: fullPhone,
                            role: 'admin'
                        }
                    }
                });

                if (error) {
                    showMsg(error.message, 'error');
                    return;
                }

                // 2. Insert record in act_signup table
                try {
                    await supabaseClient.from('act_signup').insert([{
                        user_id: data.user?.id || null,
                        email: email,
                        full_name: name,
                        phone: fullPhone,
                        role: 'admin',
                        status: 'approved'
                    }]);
                } catch (signupErr) {
                    console.warn('act_signup insert notice:', signupErr);
                }

                // 3. Insert or update in profiles table with full admin access
                if (data.user?.id) {
                    try {
                        await supabaseClient.from('profiles').upsert([{
                            id: data.user.id,
                            email: email,
                            full_name: name,
                            phone: fullPhone,
                            has_access: true,
                            has_act_access: true,
                            has_act_diag_access: true,
                            has_act_topic_access: true,
                            act_access_requested: false
                        }], { onConflict: 'id' });
                    } catch (profileErr) {
                        console.warn('profiles upsert notice:', profileErr);
                    }
                }

                // 4. Send email notification via SMTP to rupali.eduquest@gmail.com with heading 'ACT New Signup'
                if (typeof sendSignupNotification === 'function') {
                    sendSignupNotification({
                        fullName: name,
                        email: email,
                        phone: fullPhone,
                        role: 'admin'
                    });
                }

                showMsg('🎉 Admin account created! You can now login as admin.', 'success');
                setTimeout(() => {
                    setMode('login');
                    document.getElementById('adminLoginEmail').value = email;
                }, 1500);

            } catch (err) {
                console.error('Admin signup error:', err);
                showMsg('Admin signup failed. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Admin Account';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCountryDropdowns();

            const clearFields = () => {
                ['stuLoginEmail', 'stuLoginPassword', 'stuSignupName', 'stuSignupEmail', 'stuSignupPhone', 'stuSignupPassword', 'adminLoginEmail', 'adminLoginPassword', 'adminSignupName', 'adminSignupEmail', 'adminSignupPhone', 'adminSignupPassword', 'adminAccessCode'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
            };
            clearFields();
            setTimeout(clearFields, 100);
            setTimeout(clearFields, 400);
        });
    </script>
</body>

</html>
